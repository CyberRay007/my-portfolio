<svg width="850" height="1160" viewBox="0 0 850 1160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="850" height="1160" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Internet zone -->
  <rect x="225" y="40" width="400" height="110" fill="#f8cecc" stroke="#666666"/>
  <text x="235" y="62" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Internet zone</text>
  <text x="235" y="82" font-family="Arial" font-size="10" fill="#666666">Untrusted</text>
  <path d="M410,95 a15,15 0 1,1 0.1,0 M425,95 v20 l-15,15 h30 l-15,-15" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="425" y="150" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">External users</text>

  <line x1="425" y1="160" x2="425" y2="188" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Perimeter firewall + WAF -->
  <rect x="325" y="190" width="200" height="56" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="425" y="212" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">Perimeter firewall + WAF</text>
  <text x="425" y="234" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">Blocks common web attacks (OWASP Top 10)</text>

  <line x1="425" y1="246" x2="425" y2="274" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="435" y="266" font-family="Arial" font-size="8" fill="#666666">HTTPS 443</text>

  <!-- DMZ zone -->
  <rect x="225" y="276" width="400" height="140" fill="#fff2cc" stroke="#666666"/>
  <text x="235" y="298" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">DMZ</text>
  <text x="235" y="318" font-family="Arial" font-size="10" fill="#666666">Semi-trusted</text>
  <rect x="250" y="336" width="160" height="56" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="330" y="358" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">Load balancer</text>
  <text x="330" y="378" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">Distributes traffic</text>
  <rect x="440" y="336" width="160" height="56" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="520" y="358" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">Web servers (x2)</text>
  <text x="520" y="378" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">TLS termination</text>

  <line x1="425" y1="426" x2="425" y2="454" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="435" y="446" font-family="Arial" font-size="8" fill="#666666">Internal API</text>

  <!-- Internal firewall -->
  <rect x="315" y="456" width="220" height="56" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="425" y="478" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">Internal firewall</text>
  <text x="425" y="500" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">App-tier allowlist only</text>

  <line x1="425" y1="512" x2="425" y2="540" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Application zone -->
  <rect x="225" y="542" width="400" height="140" fill="#dae8fc" stroke="#666666"/>
  <text x="235" y="564" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Application zone</text>
  <text x="235" y="584" font-family="Arial" font-size="10" fill="#666666">Trusted</text>
  <rect x="250" y="602" width="160" height="56" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="330" y="624" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">App server</text>
  <text x="330" y="644" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">Runs business logic</text>
  <rect x="440" y="602" width="160" height="56" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="520" y="624" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">Auth / API gateway</text>
  <text x="520" y="644" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">Validates tokens</text>

  <line x1="425" y1="692" x2="425" y2="720" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="435" y="712" font-family="Arial" font-size="8" fill="#666666">DB queries (TLS)</text>

  <!-- Data-tier firewall -->
  <rect x="305" y="722" width="240" height="56" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="425" y="744" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">Data-tier firewall</text>
  <text x="425" y="766" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">Encrypted connections only</text>

  <line x1="425" y1="778" x2="425" y2="806" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Data zone -->
  <rect x="225" y="808" width="400" height="150" fill="#d5e8d4" stroke="#666666"/>
  <text x="235" y="830" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Data zone</text>
  <text x="235" y="850" font-family="Arial" font-size="10" fill="#666666">Highly trusted</text>
  <path d="M280,868 h60 a10,25 0 0 1 0,50 h-60 a10,25 0 0 1 0,-50 z" fill="#ffffff" stroke="#333333"/>
  <path d="M280,868 a10,10 0 0 0 60,0" fill="none" stroke="#333333"/>
  <text x="310" y="936" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">Primary database</text>
  <text x="310" y="950" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">Encrypted at rest</text>
  <path d="M500,868 h60 a10,25 0 0 1 0,50 h-60 a10,25 0 0 1 0,-50 z" fill="#ffffff" stroke="#333333"/>
  <path d="M500,868 a10,10 0 0 0 60,0" fill="none" stroke="#333333"/>
  <text x="530" y="936" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">Backup / replica</text>
  <text x="530" y="950" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">Nightly encrypted backup</text>

  <line x1="425" y1="958" x2="425" y2="988" stroke="#333333" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="435" y="978" font-family="Arial" font-size="8" fill="#666666">Logs &amp; admin access</text>

  <!-- Management zone -->
  <rect x="225" y="990" width="400" height="140" fill="#e1d5e7" stroke="#666666"/>
  <text x="235" y="1012" font-family="Arial" font-size="14" font-weight="bold" fill="#333333">Management zone</text>
  <text x="235" y="1032" font-family="Arial" font-size="10" fill="#666666">Out-of-band</text>
  <rect x="250" y="1050" width="160" height="56" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="330" y="1072" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">Bastion host</text>
  <text x="330" y="1092" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">Jump box, MFA required</text>
  <rect x="440" y="1050" width="160" height="56" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="520" y="1072" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">SIEM / logging</text>
  <text x="520" y="1092" font-family="Arial" font-size="8" text-anchor="middle" fill="#666666">Aggregates logs &amp; alerts</text>
</svg>
